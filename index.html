<style>
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(fonts/inter-regular.woff) format('woff')}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(fonts/inter-medium.woff) format('woff')}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(fonts/inter-semibold.woff) format('woff')}
@font-face{font-family:Inter;font-weight:700 900;font-display:swap;src:url(fonts/inter-bold.woff) format('woff')}
@font-face{font-family:Outfit;font-weight:300 500;font-display:swap;src:url(fonts/outfit-regular.woff) format('woff');unicode-range:U+0000-024F,U+2000-206F,U+20AC}
@font-face{font-family:Outfit;font-weight:600 900;font-display:swap;src:url(fonts/outfit-bold.woff) format('woff');unicode-range:U+0000-024F,U+2000-206F,U+20AC}

:root{
  --y:#FFD200;--y2:#FFE76A;--ya:#F5B400;--bg:#1c1e21;--card:#26292d;--line:rgba(255,255,255,.08);
  --text:#F7F7F5;--muted:#AEB2B6;--dim:#7d8287;--acc:#FFD200;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --hf:Outfit,Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"cv11","ss01";letter-spacing:-.006em;font-weight:500;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
body.lock{overflow:hidden}
body.viewing #app,body.viewing #bg,body.viewing .toast{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
img{display:block;max-width:100%}
h1,h2,h3{margin:0;font-family:var(--hf);font-weight:800;line-height:1.04;letter-spacing:-.025em}
#app{max-width:540px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;z-index:2}

/* ================= BACKGROUND: sharp catalog pattern ================= */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#1c1e21}
#bg .slate{position:absolute;inset:-4%;background:url(img/ui/9f93b0480f.jpg) center/cover;opacity:.5;animation:slatePan 60s ease-in-out infinite alternate}
@keyframes slatePan{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.08) translate3d(-2%,-2%,0)}}
#bg .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,30,33,.55),rgba(28,30,33,.86) 55%,#17191b)}
#bg .rows{position:absolute;left:-30%;right:-30%;top:-5%;bottom:-5%;transform:rotate(-14deg);display:flex;flex-direction:column;justify-content:space-around}
#bg .row{white-space:nowrap;font-family:var(--hf);font-weight:800;font-size:12vmin;line-height:1;letter-spacing:-.01em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.13)}
#bg .row span{display:inline-block;padding-right:.4em}
#bg .row.f{color:rgba(255,210,0,.035);-webkit-text-stroke:1px rgba(255,210,0,.12)}
#bg .row.l{animation:mL 85s linear infinite}#bg .row.r{animation:mR 100s linear infinite}
@keyframes mL{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
@keyframes mR{from{transform:translate3d(-50%,0,0)}to{transform:translate3d(0,0,0)}}
#bg .hrt{position:absolute;width:90vmin;height:90vmin;opacity:.14}
#bg .hrt path{fill:none;stroke:var(--acc);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-dasharray:3 6;transition:stroke 1.2s}
#bg .h1{right:-38vmin;top:6vh;animation:hspin 70s linear infinite}
#bg .h2{left:-42vmin;bottom:-30vmin;width:110vmin;height:110vmin;opacity:.09;animation:hspin 95s linear infinite reverse}
@keyframes hspin{to{transform:rotate(360deg)}}
#bg .arrows{position:absolute;left:6%;top:58%;display:flex;gap:10px;opacity:.16}
#bg .arrows svg{width:60px;height:24px;stroke:var(--y);fill:none;stroke-width:2.4;animation:arr 3.6s var(--ease) infinite}
#bg .arrows svg:nth-child(2){animation-delay:.25s}#bg .arrows svg:nth-child(3){animation-delay:.5s}
@keyframes arr{0%,100%{transform:translateX(0);opacity:.3}50%{transform:translateX(16px);opacity:1}}

/* ================= INTRO ================= */
#intro{position:fixed;inset:0;z-index:100;background:#17191b;display:grid;place-items:center;overflow:hidden;cursor:pointer}
#intro::before{content:"";position:absolute;inset:0;background:url(img/ui/9f93b0480f.jpg) center/cover;opacity:.55}
#intro .glow{position:absolute;width:80vmin;height:80vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,210,0,.28),rgba(255,210,0,0) 62%);opacity:0}
#intro .ing{position:absolute;width:76px;opacity:0;pointer-events:none}
#intro .stage{position:relative;width:min(84vw,420px);aspect-ratio:900/301}
#intro .stage .base{position:absolute;inset:0;width:100%;opacity:0;clip-path:inset(0 100% 0 0)}
#intro .stage .ht{position:absolute;left:40.78%;top:0;width:22.56%;right:auto;bottom:auto;opacity:0;transform-origin:50% 50%}
#intro .tag{position:absolute;left:0;right:0;top:calc(50% + min(22vw,110px));text-align:center;font-family:var(--hf);font-weight:600;letter-spacing:.32em;font-size:13px;color:var(--y);opacity:0}
#intro .skip{position:absolute;bottom:calc(24px + var(--safe-b));left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.45);letter-spacing:.06em}

/* ================= transitions ================= */
.view{position:relative}
.enter-fwd{animation:inFwd .5s var(--ease) both}.enter-back{animation:inBack .5s var(--ease) both}.enter-up{animation:inUp .7s var(--ease) both}
.vghost{position:fixed!important;z-index:3;pointer-events:none;margin:0!important}
.leave-fwd{animation:outFwd .45s var(--ease) both}.leave-back{animation:outBack .45s var(--ease) both}
@keyframes inFwd{from{opacity:0;transform:translate3d(18px,0,0)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translate3d(-18px,0,0)}to{opacity:1;transform:none}}
@keyframes outFwd{to{opacity:0;transform:translate3d(-48px,0,0) scale(.97)}}
@keyframes outBack{to{opacity:0;transform:translate3d(48px,0,0) scale(.97)}}
@keyframes inUp{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
.stg{animation:stgIn .55s var(--ease) backwards;animation-delay:calc(var(--i,0) * 35ms + 80ms)}
@keyframes stgIn{from{opacity:0;transform:translate3d(0,10px,0)}}
@keyframes rise{from{opacity:0;transform:translate3d(0,26px,0)}}
.rv{opacity:0;transform:translate3d(0,18px,0);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-20deg)}}
@keyframes shine{0%,72%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(140%) skewX(-18deg)}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.07)}24%{transform:scale(1)}36%{transform:scale(1.04)}50%{transform:scale(1)}}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 70%);transform:scale(0);animation:rip .7s var(--ease) forwards;z-index:3}
@keyframes rip{to{transform:scale(1);opacity:0}}
.fly,.burst{position:fixed;z-index:80;pointer-events:none;width:64px;filter:drop-shadow(0 12px 14px rgba(0,0,0,.5));will-change:transform}

/* ================= bars ================= */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 10px;background:rgba(28,30,33,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.bar .ttl{flex:1;min-width:0;font-family:var(--hf);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .35s,transform .35s var(--ease)}
.bar.float{background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;transition:background .35s}
.bar.float .ttl{opacity:0;transform:translateY(8px)}
.bar.float.solid{background:rgba(28,30,33,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-color:var(--line)}
.bar.float.solid .ttl{opacity:1;transform:none}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;position:relative;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);transition:transform .45s var(--spring)}
.bar.float .iconbtn{background:rgba(0,0,0,.45);}
.iconbtn:active{transform:scale(.86)}
.iconbtn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sndbtn.off svg{opacity:.4}
.steplbl{font-family:var(--hf);font-weight:600;font-size:16px;flex:1}
.steplbl b{color:var(--y)}
.tray{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 0;position:relative}
.tray::before,.tray .fill{content:"";position:absolute;left:44px;right:44px;top:50%;margin-top:7px;height:3px;border-radius:3px;background:rgba(255,255,255,.08)}
.tray .fill{right:auto;width:var(--w,0);background:linear-gradient(90deg,var(--ya),var(--y));transition:width .9s var(--ease)}
.slot{width:46px;height:46px;border-radius:50%;background:#1f2225;border:1.5px solid rgba(255,255,255,.12);display:grid;place-items:center;position:relative;z-index:1;transition:all .5s var(--ease)}
.slot img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.slot.on{border-color:rgba(255,210,0,.7)}
.slot.on img{animation:pop .7s var(--spring) backwards}
.slot.cur{border-color:var(--y);box-shadow:0 0 0 5px rgba(255,210,0,.12)}

/* ================= surfaces & buttons ================= */
.cta,.opt,.btn2,.row,.tile,.fchip,.card,.qtile,.tchip,.lnk{position:relative;overflow:hidden;isolation:isolate}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;border-radius:20px;font-family:var(--hf);font-weight:700;font-size:18px;color:#17181a;text-decoration:none;
  background:linear-gradient(180deg,var(--y2) 0%,var(--y) 50%,var(--ya) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 16px 36px -14px rgba(255,200,0,.75);transition:transform .5s var(--spring)}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:translateX(-140%) skewX(-18deg);animation:shine 5s var(--ease) 2s infinite;pointer-events:none}
.cta:active{transform:scale(.955)}
.cta svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s var(--spring)}
.cta:active svg{transform:translateX(6px)}
.cta[disabled]{filter:grayscale(1);opacity:.35}.cta[disabled]::after{display:none}
.cta.ghost{color:var(--text);font-weight:600;font-size:16px;min-height:56px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);box-shadow:none}
.cta.ghost::after{display:none}
.glass{background:linear-gradient(180deg,rgba(52,55,59,.94),rgba(38,41,44,.94));border:1px solid rgba(255,255,255,.085);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 18px 38px -26px rgba(0,0,0,.95)}
.pad{padding:18px 18px 0}
.kicker{font-family:var(--hf);font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--y)}
.lead{color:var(--muted);font-size:15px;line-height:1.55;margin:10px 0 0}
.tri{width:13px;height:13px;flex:none;stroke:var(--y);fill:none;stroke-width:2.6;stroke-linejoin:round}

/* ================= start ================= */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + var(--safe-t)) 18px 0;position:relative;z-index:3}
.mlogo{position:relative;width:min(56vw,230px);aspect-ratio:900/301;animation:rise 1s var(--ease) .1s backwards}
.mlogo img{position:absolute;inset:0;width:100%}
.mlogo .ht{left:40.78%;width:22.56%;top:0;right:auto;bottom:auto;transform-origin:50% 60%;animation:beat 3.8s ease-in-out 1.2s infinite}
.hero{padding:26px 18px 0;position:relative}
.hero h1{font-size:clamp(50px,14.5vw,76px);font-weight:800;line-height:.94;letter-spacing:-.04em}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.07em}
.hero h1 .w{display:inline-block;transform:translateY(108%);animation:wordUp 1s var(--ease) forwards}
@keyframes wordUp{to{transform:none}}
.hero h1 .hl{position:relative;padding:0 .12em;margin-left:-.06em;isolation:isolate}
.hero h1 .hl::before{content:"";position:absolute;inset:.08em -.02em .02em;background:linear-gradient(100deg,var(--ya),var(--y) 45%,var(--y2));border-radius:.16em;z-index:-1;transform:scaleX(0);transform-origin:left;animation:mark .85s var(--ease) 1s forwards;box-shadow:0 12px 40px -10px rgba(255,210,0,.6)}
@keyframes mark{to{transform:scaleX(1)}}
.hero h1 .hl .w{animation:wordUp 1s var(--ease) forwards,toDark .25s 1.3s forwards}
@keyframes toDark{to{color:#17181a}}
.hero p{color:#d2d5d7;font-size:16px;line-height:1.55;margin:16px 0 0;max-width:31ch;animation:rise .9s var(--ease) 1s backwards}
.visual{position:relative;margin:26px 18px 0;height:250px;animation:rise 1s var(--ease) 1.1s backwards}
.visual .img{position:absolute;inset:0;border-radius:28px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.08)}
.visual .img div{position:absolute;inset:-8%;background-size:cover;background-position:center 35%;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.12) translate3d(-3%,2%,0)}}
.visual .img::after{content:"";position:absolute;inset:0;background:linear-gradient(200deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55))}
.visual .yr{position:absolute;left:18px;bottom:8px;font-family:var(--hf);font-weight:900;font-size:110px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.85);letter-spacing:-.05em}
.badge{position:absolute;right:-6px;top:-24px;width:118px;height:118px;border-radius:50%;background:#17181a;border:2px solid var(--y);display:grid;place-items:center;box-shadow:0 16px 30px -10px rgba(0,0,0,.7)}
.badge svg.ring{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);animation:hspin 34s linear infinite;overflow:visible}
.badge svg.ring text{font-family:var(--hf);font-weight:700;font-size:9.2px;fill:var(--y)}
.badge .bh{width:38px;position:relative;z-index:1;animation:beat 3.8s ease-in-out infinite}
.flow{display:flex;align-items:center;gap:6px;margin:22px 18px 0;animation:rise .9s var(--ease) 1.2s backwards}
.fstep{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.fstep b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--hf);font-weight:800;font-size:14px;color:#17181a;background:linear-gradient(145deg,var(--y2),var(--ya));box-shadow:0 6px 16px -6px rgba(255,210,0,.6)}
.fstep span{font-size:12.5px;line-height:1.2;color:#e9e9e9;font-weight:600}
.flow .fl{flex:none;width:14px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,210,0,.7),rgba(255,210,0,.15))}
.stat{padding:12px;border-radius:18px;text-align:left}
.stat b{display:block;font-family:var(--hf);font-size:28px;color:#fff;font-weight:700;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.startcta{padding:20px 18px 0;display:grid;gap:10px;animation:rise .9s var(--ease) 1.4s backwards}
.sect{padding:40px 18px 0}
.sect h2{font-size:30px;margin-top:8px}
.catscroll{display:flex;gap:10px;overflow-x:auto;padding:16px 18px 6px;margin:0 -18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.catscroll::-webkit-scrollbar{display:none}
.catscroll .tile{flex:none;width:152px;min-height:184px;scroll-snap-align:start}
.katcard{display:block;width:100%;text-align:left;margin-top:16px;border-radius:28px;padding:20px;position:relative;overflow:hidden;min-height:250px}
.katcard h3{font-size:23px;max-width:52%}
.katcard p{font-size:14px;color:var(--muted);margin:8px 0 0;max-width:52%;line-height:1.45}
.katcard .open{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-family:var(--hf);font-weight:700;color:#17181a;background:var(--y);padding:11px 16px;border-radius:14px}
.katcard .open svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4}
.fan{position:absolute;right:-34px;top:30px;width:44%;height:210px}
.fan img{position:absolute;right:10px;top:0;width:118px;border-radius:6px;box-shadow:0 16px 30px -10px rgba(0,0,0,.8);transform-origin:50% 120%;transition:transform 1.1s var(--ease)}
.fan img:nth-child(1){transform:rotate(0)}.fan img:nth-child(2){transform:rotate(0)}.fan img:nth-child(3){transform:rotate(0)}
.katcard.in .fan img:nth-child(1){transform:rotate(-12deg) translateX(-10px)}
.katcard.in .fan img:nth-child(2){transform:rotate(-4deg) translateX(-6px)}
.katcard.in .fan img:nth-child(3){transform:rotate(9deg) translateX(14px) translateY(6px)}
.howto{display:grid;gap:10px;margin-top:16px}
.howto div{display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px}
.howto b.n{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--hf);font-weight:800;font-size:18px;background:linear-gradient(145deg,var(--y2),var(--ya));color:#17181a}
.howto span{font-size:14px;color:#d6d8da;line-height:1.4}.howto span strong{color:#fff;display:block;font-size:15.5px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.qtile{border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:124px;transition:transform .5s var(--spring);text-decoration:none}
.qtile .qi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,210,0,.13)}
.qtile .qi svg{width:22px;height:22px;stroke:var(--y);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qtile b{font-family:var(--hf);font-size:16.5px;font-weight:700;display:block}
.qtile .s{font-size:12.5px;color:var(--muted)}
.qtile:active,.opt:active,.row:active,.tile:active,.katcard:active{transform:scale(.965)}
.foot{margin:40px 18px 0;padding:18px 0 calc(28px + var(--safe-b));border-top:1px solid var(--line);font-size:12px;color:var(--dim);line-height:1.6;text-align:center}

/* ================= quiz ================= */
.q{padding:20px 18px 0}
.q h2{font-size:31px}
.q .hint{color:var(--muted);font-size:14px;margin-top:10px;display:flex;align-items:center;gap:8px}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#17181a;background:var(--y);padding:3px 8px;border-radius:999px}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:70px;padding:14px 16px;border-radius:22px;text-align:left;transition:transform .5s var(--spring),border-color .3s,box-shadow .4s,background .4s}
.opt .tx{flex:1;min-width:0}
.opt b{display:block;font-family:var(--hf);font-size:17.5px;font-weight:600;line-height:1.2}

.chk{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.22);flex:none;display:grid;place-items:center;transition:background .3s,border-color .3s,transform .5s var(--spring)}

.opt.on .ic{transform:scale(1.08) rotate(-6deg);background:linear-gradient(145deg,var(--y2),var(--ya))}

.hearts{display:flex;gap:3px}
.hearts svg{width:18px;height:17px;animation:pop .6s var(--spring) backwards}
.hearts svg:nth-child(2){animation-delay:.1s}.hearts svg:nth-child(3){animation-delay:.2s}
.hearts.sm svg{width:14px;height:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.tile{--c:#888;position:relative;min-height:144px;border-radius:24px;text-align:left;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(155deg,color-mix(in srgb,var(--c) 90%,#fff 10%),color-mix(in srgb,var(--c) 62%,#000 38%));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 18px 32px -20px rgba(0,0,0,.95);transition:transform .5s var(--spring),box-shadow .4s}
.tile::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 72%,#000 28%),color-mix(in srgb,var(--c) 30%,transparent) 55%,transparent 80%);pointer-events:none}
.tile::after{content:"";position:absolute;inset:0;z-index:4;border-radius:inherit;box-shadow:inset 0 0 0 0 var(--y);transition:box-shadow .4s var(--ease);pointer-events:none}
.tile .nm{position:relative;z-index:3;font-family:var(--hf);font-weight:700;font-size:17px;line-height:1.08;color:#fff;max-width:68%}
.tile .sb{position:relative;z-index:3;font-size:11px;color:rgba(255,255,255,.86);margin-top:5px;max-width:70%;line-height:1.3}
.tile .ppl{position:absolute;right:-10px;bottom:0;height:104%;max-width:52%;object-fit:contain;object-position:bottom right;z-index:1;transition:transform .7s var(--ease)}
.tile .ingi{position:absolute;right:-12px;top:-8px;width:100px;z-index:1;transform:rotate(-10deg);filter:drop-shadow(0 10px 12px rgba(0,0,0,.35));transition:transform .7s var(--spring)}
.tile .icn{position:absolute;right:12px;top:14px;width:52px;height:52px;z-index:1;transition:transform .7s var(--spring)}
.tile .icn svg{width:100%;height:100%;stroke:rgba(255,255,255,.92);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tile .chk{position:absolute;left:12px;top:12px;z-index:5;background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.75)}
.tile.on::after{box-shadow:inset 0 0 0 3px var(--y)}
.tile.on .ppl{transform:scale(1.06) translateY(-3px)}.tile.on .ingi{transform:rotate(8deg) scale(1.12)}.tile.on .icn{transform:rotate(-8deg) scale(1.12)}
.tile.lite .nm{color:#17181a}.tile.lite .sb{color:rgba(0,0,0,.72)}.tile.lite .icn svg{stroke:rgba(0,0,0,.75)}
.tile.full{grid-column:1/-1;min-height:68px;justify-content:center}
.tgrp{margin-top:22px}
.tgrp .gh{display:flex;align-items:center;gap:8px;font-family:var(--hf);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.tgrp .gh i{width:20px;height:4px;border-radius:2px;background:var(--c)}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tchip{display:inline-flex;align-items:center;gap:8px;padding:12px 15px;border-radius:16px;font-weight:600;font-size:14.5px;transition:transform .5s var(--spring),background .3s,border-color .3s}
.tchip .chk{width:22px;height:22px;border-radius:7px}.tchip .chk svg{width:12px;height:12px}
.tchip.on{background:linear-gradient(135deg,rgba(255,210,0,.2),rgba(255,210,0,.05))!important;border-color:rgba(255,210,0,.7)!important}
.tchip:active{transform:scale(.94)}
.dock{position:sticky;bottom:0;z-index:10;padding:18px 18px calc(16px + var(--safe-b));margin-top:16px;background:linear-gradient(180deg,rgba(28,30,33,0),rgba(28,30,33,.94) 34%)}

.dock.hide .cta{transform:translateY(130%);opacity:0;pointer-events:none}
.selcount{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px;min-height:1em}

/* ================= results ================= */
.reshead h1{font-size:36px;margin-top:8px}
.sumchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);color:#e2e2e2}

@keyframes floaty{to{transform:rotate(8deg) translateY(-10px)}}

.pg{position:absolute;right:14px;top:14px;z-index:2;font-family:var(--hf);font-weight:700;font-size:13px;color:#fff;background:rgba(0,0,0,.4);padding:5px 10px;border-radius:999px}
.catpill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:5px 10px;border-radius:999px;background:var(--c)}

.card .body{padding:2px 20px 20px;position:relative;z-index:2}

.metarow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvltag{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.07);border-radius:999px;padding:5px 10px 5px 8px;font-size:11px;font-weight:700}
.match{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}

.why{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:7px}

.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.facts span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#ddd;background:rgba(255,255,255,.06);padding:6px 10px;border-radius:10px}

.btnrow{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin-top:18px}
.btn2{min-height:52px;border-radius:16px;font-family:var(--hf);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .5s var(--spring);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);text-decoration:none}

.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px 10px 10px;margin-top:10px;border-radius:22px;transition:transform .5s var(--spring)}

.row .tx{flex:1;min-width:0}
.row .t{display:block;font-family:var(--hf);font-size:16px;font-weight:600;line-height:1.2}

.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--y)}

/* ================= catalog list ================= */

/* ================= detail ================= */
.dhero{position:relative;height:330px;margin-top:calc(-65px - var(--safe-t));overflow:hidden;background:linear-gradient(155deg,color-mix(in srgb,var(--c) 90%,#fff 10%),color-mix(in srgb,var(--c) 55%,#000 45%))}

/* ================= catalog viewer ================= */
#viewer{position:fixed;inset:0;z-index:90;background:#121315;display:none;flex-direction:column}
#viewer.open{display:flex;animation:vIn .35s ease both}
@keyframes vIn{from{opacity:0}to{opacity:1}}
#viewer .vbar{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;background:rgba(18,19,21,.95);border-bottom:1px solid var(--line);z-index:2}
#viewer .vt{flex:1;min-width:0}
#viewer .vt b{display:block;font-family:var(--hf);font-size:16px;font-weight:700}
#viewer .vt span{font-size:12px;color:var(--muted)}
#pager{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-x pan-y}

#pager.zoomed{overflow:hidden;scroll-snap-type:none}
.pslide{flex:none;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:12px;position:relative}

.kfi2{position:relative;padding:14px 14px 13px 14px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08)}
.kfi2.full{grid-column:1/-1}
.kfi2 .ki{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--c,#FFD200) 18%,transparent);margin-bottom:9px}
.kfi2 .ki svg{width:16px;height:16px;stroke:var(--c,var(--y));fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.kfi2 small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.kfi2 b{display:block;font-size:15px;font-weight:600;margin-top:4px;line-height:1.35}
.kfi2 .lvb{display:flex;align-items:center;gap:10px}
.kcost{margin:10px 18px 0;font-size:13px;color:var(--muted);line-height:1.45}
.dsec{padding:18px 16px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.07)}
.dh{font-size:12px;letter-spacing:.14em}
.dsec li{font-size:14.5px}
.kw-ic{transform-box:fill-box;transform-origin:center}
.kw-orbit,.kw-core,.pr-sheen{transform-box:fill-box!important;transform-origin:center!important}
.kw-orbit{animation:none!important;stroke-dasharray:2 8;opacity:.6}
.kwheel svg{overflow:visible}

/* ===== v16 buttons ===== */
.cta{background:linear-gradient(180deg,#FFE97A 0%,#FFD200 45%,#F2B100 100%)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -2px 0 rgba(180,120,0,.35),0 14px 30px -12px rgba(255,190,0,.75),0 0 0 1px rgba(255,220,80,.6)!important}
.cta:active{transform:scale(.97) translateY(1px)}
.cta.ghost{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 1px rgba(255,255,255,.12)!important;border:0!important}
.iconbtn{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 18px -10px rgba(0,0,0,.8)}
.iconbtn:hover{border-color:rgba(255,210,0,.5)}
.btn2{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.05))!important;border:1px solid rgba(255,255,255,.12)!important}
.btn2.y{background:linear-gradient(180deg,#FFE97A,#FFD200 50%,#F2B100)!important;border:0!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 22px -12px rgba(255,190,0,.8)}
.lnk .pi{background:linear-gradient(145deg,#FFE97A,#FFC400);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 16px -8px rgba(255,190,0,.7)}
.path.p2{background:linear-gradient(135deg,rgba(255,210,0,.12),rgba(40,42,46,.95) 55%)}
.path.p3{background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(40,42,46,.95) 60%)}
.opt.on{background:linear-gradient(135deg,rgba(255,210,0,.24),rgba(255,180,0,.06))!important}
.fchip.on{box-shadow:0 6px 16px -8px var(--c)}
/* ===== instagram ===== */
.igcard2{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:22px;text-decoration:none;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden;transition:transform .5s var(--spring)}
.igcard2::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 140% at 0% 50%,rgba(214,41,118,.22),transparent 55%);pointer-events:none}
.igcard2:active{transform:scale(.97)}
.igav{position:relative;flex:none;width:58px;height:58px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);animation:igspin 6s linear infinite}
.igav img{width:100%;height:100%;border-radius:50%;border:2.5px solid #1c1e21;display:block;animation:igspin 6s linear infinite reverse}
@keyframes igspin{to{transform:rotate(360deg)}}
.igtx2{position:relative;flex:1;min-width:0}.ign{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.igmini{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;opacity:.8}
.igtx2 small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.igfollow{position:relative;flex:none;padding:9px 16px;border-radius:12px;font-weight:700;font-size:13.5px;color:#fff;background:linear-gradient(90deg,#f58529,#dd2a7b 50%,#8134af);box-shadow:0 8px 18px -8px rgba(221,42,123,.8)}
/* ===== video library ===== */
.nfsub{padding:2px 18px 8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#ff9a3c}
button.nftile{padding:0;border:0;text-align:start}
.nftile.soon{opacity:.85}.nftile.soon .nfgrad{background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.88))}
.nfsoon{position:absolute;left:10px;top:10px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.6);color:#ffb34d;border:1px solid rgba(255,179,77,.5)}
.nfdur{position:absolute;right:10px;bottom:10px;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.65)}
.vp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.vp-top b{font-family:var(--hf);font-size:18px}
.vp-x{position:relative;top:auto;right:auto}
.vp-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px}
.vp-load img{width:34px;height:28px;object-fit:contain;animation:hlbeat 1.2s infinite;animation-delay:calc(var(--i)*.18s)}
.vp-frame iframe{opacity:0;transition:opacity .5s}.vp-frame iframe.ld{opacity:1}
.vp-next{margin-top:16px}.vp-next small{display:block;font-weight:700;color:var(--muted);margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}.vp-next .nfscroll{padding:4px 0 6px}
.vp-box{max-height:100%;overflow:auto;padding:calc(10px + var(--safe-t,0px)) 0 calc(10px + var(--safe-b,0px))}
.vp-tt{display:flex;flex-direction:column;min-width:0}.vp-tt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vp-tt small{font-size:12px;color:var(--muted);margin-top:2px}
.vp-btns{display:flex;align-items:center;gap:8px;flex:none}
.vp-ext{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#FCE531;text-decoration:none;padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.08)}.vp-ext svg{width:14px;height:14px}
.vp-box.tall{width:min(94vw,520px)}
.vp-frame.tall{aspect-ratio:9/16;width:min(100%,calc((100svh - 250px)*9/16));margin:0 auto}
.nftile.sm.tall{width:110px;aspect-ratio:9/16}
.vp-fsbar{display:none}
/* Fresh Digital – Album-Fächer */
.fdv[data-alb=""] .fxsec{display:none}
.fdv[data-alb=hg] .fxsec[data-sec=lege],.fdv[data-alb=lege] .fxsec[data-sec=hg]{display:none}
.fdv:not([data-alb=""]) .fxfan{display:none}
.fdv.fxs .fxfan,.fdv.fxs .fxah{display:none!important}
.fxfan{position:relative;margin:0 0 4px;padding:30px 0 6px;overflow:hidden}
.fxfan-in{display:flex;justify-content:center;align-items:flex-start;padding:0 18px}
.fxalb{--w:min(38vw,250px);position:relative;z-index:calc(1 + var(--k));flex:none;width:var(--w);margin:0 -8px;padding:0;border:0;background:none;color:#fff;cursor:pointer;text-align:center;font:inherit;transform-origin:50% 140%;transform:rotate(var(--r));transition:transform .5s var(--ease);-webkit-tap-highlight-color:transparent}
.fxalb:hover,.fxalb:focus-visible{transform:rotate(calc(var(--r) * .55)) translateY(-8px);outline:none}
.fxalb:active{transform:rotate(calc(var(--r) * .55)) translateY(-3px) scale(.97)}
.fxalb-s{position:relative;z-index:2;display:block;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#151515;box-shadow:0 26px 46px -18px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.1),0 16px 44px -22px rgba(255,140,0,.6)}
.fxalb-s img{display:block;width:100%;height:100%;object-fit:cover}
.fxalb-s::after{content:"";position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.2),transparent 38%);pointer-events:none}
.fxalb-d{position:absolute;z-index:1;top:5%;left:5%;width:90%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#FCE531 0 15%,#111 15.5% 17.5%,transparent 18%),repeating-radial-gradient(circle,#151515 0 2px,#222 2px 3.5px);box-shadow:0 12px 30px -12px #000,inset 0 0 0 1px rgba(255,255,255,.06);transition:transform .7s var(--ease)}
.fxalb-d i{position:absolute;inset:48.5%;border-radius:50%;background:#111}
.fxalb[data-album=hg] .fxalb-d{transform:translateX(-20%) rotate(-40deg)}
.fxalb[data-album=lege] .fxalb-d{transform:translateX(20%) rotate(40deg)}
.fxalb[data-album=hg]:hover .fxalb-d{transform:translateX(-27%) rotate(-120deg)}
.fxalb[data-album=lege]:hover .fxalb-d{transform:translateX(27%) rotate(120deg)}
.fxalb-t{display:flex;flex-direction:column;gap:3px;margin-top:14px}
.fxalb-t b{font:800 16.5px/1.1 var(--hf)}
.fxalb-t small{font-size:12px;color:var(--muted,#aaa)}
.fxfan-h{margin:14px 0 0;text-align:center;font-size:12.5px;color:var(--muted,#aaa)}
.fxfan.intro .fxalb{animation:fxalbin .85s var(--ease) both;animation-delay:calc(var(--k) * .13s + .1s)}
.fxfan.intro .fxalb-d{animation:fxdisc 1.1s var(--ease) both;animation-delay:calc(var(--k) * .13s + .6s)}
@keyframes fxalbin{from{opacity:0;transform:translateY(70px) rotate(0deg) scale(.88)}}
@keyframes fxdisc{from{transform:translateX(0) rotate(0deg)}}
.fxfan.ret .fxalb{animation:fxfade .5s ease both}
@keyframes fxfade{from{opacity:0}}
.fxah{margin:0 18px 8px;animation:fxin .5s var(--ease) both}
.fxback{display:inline-flex;align-items:center;gap:6px;height:36px;margin:0 0 14px;padding:0 14px 0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.07);color:#fff;font:700 13.5px/1 var(--hf);cursor:pointer}
.fxback svg{width:16px;height:16px;transform:rotate(180deg)}
.fxah-in{display:flex;align-items:center;gap:16px}
.fxah-c{flex:none;width:clamp(112px,32vw,210px);aspect-ratio:1;object-fit:cover;border-radius:14px;box-shadow:0 22px 40px -18px #000,0 0 0 1px rgba(255,255,255,.1),0 14px 40px -22px rgba(255,140,0,.6)}
.fxah-tx{min-width:0;display:flex;flex-direction:column;gap:7px}
.fxah-tx h2{margin:0;font-family:var(--hf);font-size:clamp(24px,6.4vw,52px);line-height:1.02;background:linear-gradient(180deg,#fff,#ffe9a0);-webkit-background-clip:text;background-clip:text;color:transparent}
.fxah-tx p{margin:0;font-size:13.5px;line-height:1.35;color:#d0d0d0}
.fxah-b{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:2px}
.fxah .fxh-btn{margin:0;border:0;cursor:pointer;font-family:inherit;padding:10px 16px;font-size:14px}
.fxah-v{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:#FCE531;text-decoration:none}
.fxah-v svg{width:14px;height:14px}
.fxsec.alb-in .nfrow{animation:fxrow .6s var(--ease) both;animation-delay:calc(var(--ri) * .07s + .25s)}
@keyframes fxrow{from{opacity:0;transform:translateY(24px)}}
.fxfly{position:fixed;z-index:300;margin:0;object-fit:cover;border-radius:14px;pointer-events:none;box-shadow:0 30px 60px -20px #000;will-change:transform}
@media (min-width:900px){.fxalb{--w:260px;margin:0 -12px}.fxfan{padding-top:40px}.fxah{margin:0 var(--dpx,32px) 10px}.fxah-in{gap:28px}.fxah-tx p{font-size:16px}}
#vplayer.vp-fs{background:#000}
#vplayer.vp-fs .vp-box{position:fixed;inset:0;width:auto;max-height:none;overflow:hidden;padding:0}
#vplayer.vp-fs .vp-top,#vplayer.vp-fs .vp-next{display:none}
#vplayer.vp-fs .vp-frame{position:absolute;inset:-100vmax;margin:auto;transform:none;--fw:min(100vw,100dvh * var(--a));width:var(--fw);height:calc(var(--fw) / var(--a));aspect-ratio:auto;border-radius:0;box-shadow:none;transition:transform .35s var(--ease,ease)}
#vplayer.vp-fs.vp-rot .vp-frame{--fw:min(100dvh,100vw * var(--a));transform:rotate(90deg)}
@media (hover:hover) and (pointer:fine){.vp-rot{display:none!important}}
@media (max-height:500px){.vp-frame.tall{width:min(100%,calc((100svh - 80px)*9/16))}}
#vplayer.vp-fs .vp-fsbar{display:flex;gap:10px;position:fixed;z-index:5;top:calc(12px + var(--safe-t,0px));right:calc(12px + env(safe-area-inset-right,0px))}
#vplayer.vp-fs .vp-fsbar .iconbtn{background:rgba(0,0,0,.55)}
/* ===== profile rings ===== */
.arings{position:relative;width:min(330px,84vw);aspect-ratio:1;margin:18px auto 6px}
.arings svg{width:100%;height:100%;overflow:visible}
.ar-track{fill:none;stroke:rgba(255,255,255,.07)}
.ar-fill{fill:none;stroke-linecap:round;stroke-dasharray:var(--C);stroke-dashoffset:var(--C);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 70%,transparent));transition:stroke-dashoffset 1.6s cubic-bezier(.22,1,.36,1);transition-delay:calc(var(--i)*.18s)}
.ar.in .ar-fill{stroke-dashoffset:var(--off)}
.ar-dot{opacity:0;transition:opacity .5s;transition-delay:calc(1.4s + var(--i)*.18s)}
.ar.in .ar-dot{opacity:.95}
.ar-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;pointer-events:none}
.ar-center img{width:26px;margin-bottom:2px;filter:drop-shadow(0 4px 10px rgba(255,200,0,.5))}
.ar-center b{font-family:var(--hf);font-size:30px;line-height:1}.ar-center small{font-size:11px;color:var(--muted);font-weight:600}
.ar-legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.arl{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,transparent),rgba(255,255,255,.03));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);font-size:12.5px;font-weight:600;animation:rise .6s var(--ease) backwards;animation-delay:calc(1s + var(--i)*.1s)}
.arl i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.arl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arl b{font-family:var(--hf);font-size:15px;color:var(--c)}
.kdet{display:grid;gap:10px;margin:16px 0 4px}
.kdf{padding:14px;border-radius:20px;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 12%,rgba(40,42,46,.96)),rgba(34,36,40,.96) 70%);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);opacity:0;transform:translateY(14px);transition:opacity .6s,transform .7s var(--spring);transition-delay:calc(var(--i)*.1s)}
.kdf.in{opacity:1;transform:none}
.kdh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.kdh b{font-family:var(--hf);font-size:16px}
.kdh .kbi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent)}
.kdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px;border-top:1px solid rgba(255,255,255,.05)}
.kdr span:first-child{min-width:0;color:#e6e6e4}
.kseg{display:flex;gap:3px;flex:none}
.kseg i{width:14px;height:7px;border-radius:3px;background:rgba(255,255,255,.1)}
.kdf.in .kseg i.on{background:linear-gradient(90deg,var(--c),var(--c2));box-shadow:0 0 6px color-mix(in srgb,var(--c) 60%,transparent);animation:segIn .4s var(--spring) backwards;animation-delay:calc(.4s + var(--j)*.012s)}
@keyframes segIn{from{transform:scaleX(0)}}
/* ===== smoother motion ===== */
@keyframes stgIn{from{opacity:0;transform:translateY(16px) scale(.98);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.enter-fwd{animation:inFwd .55s cubic-bezier(.22,1,.36,1) both}.enter-back{animation:inBack .55s cubic-bezier(.22,1,.36,1) both}
.kw-arc{transition:stroke-dashoffset 1.3s cubic-bezier(.65,0,.35,1),stroke-width .5s var(--spring)}
.kw-ic{animation:kwpop2 .9s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:calc(.9s + var(--i)*.15s);opacity:0}
@keyframes kwpop2{0%{opacity:0;transform:var(--t,none) scale(.3)}100%{opacity:1}}
.kitem{transition:border-color .4s,box-shadow .5s,transform .5s var(--spring),background .5s}
.kitem.done{box-shadow:0 14px 30px -20px color-mix(in srgb,var(--c) 70%,transparent)}

/* ===== start v2 ===== */
.ghostbtn{visibility:hidden}
.st2 .top{position:relative;z-index:3}
.s2hero{position:relative;padding:30px 18px 6px;overflow:visible}
.s2hero h1{font-size:clamp(48px,13.5vw,74px);line-height:.94;letter-spacing:-.045em;margin-top:14px}
.s2hero h1 .ln{display:block;overflow:hidden;padding-bottom:.07em}
.s2hero h1 .w{display:inline-block;transform:translateY(108%);animation:wordUp 1s var(--ease) forwards}
.s2hero h1 .hl{position:relative;padding:0 .12em;margin-left:-.06em;isolation:isolate}
.s2hero h1 .hl::before{content:"";position:absolute;inset:.08em -.02em .02em;background:linear-gradient(100deg,var(--ya),var(--y) 45%,var(--y2));border-radius:.16em;z-index:-1;transform:scaleX(0);transform-origin:left;animation:hlIn .8s var(--ease) 1s forwards}
@keyframes hlIn{to{transform:scaleX(1)}}
.s2hero h1 .hl .w{animation:wordUp 1s var(--ease) forwards,toDark .25s 1.3s forwards}
.s2hero p{color:#d2d5d7;font-size:16px;line-height:1.55;margin:16px 0 0;max-width:30ch;animation:rise .9s var(--ease) 1s backwards}
.s2orb{position:absolute;right:-30px;top:-10px;width:210px;height:210px;pointer-events:none;z-index:-1;animation:rise 1.2s var(--ease) .5s backwards}
.s2orb .o1,.s2orb .o2{position:absolute;inset:0;border-radius:50%}
.s2orb .o1{background:conic-gradient(from 0deg,rgba(255,210,0,0),rgba(255,210,0,.55),rgba(255,140,0,0) 40%,rgba(255,210,0,.35) 70%,rgba(255,210,0,0));-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 66%,transparent 67%);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 66%,transparent 67%);animation:spin 9s linear infinite}
.s2orb .o2{background:radial-gradient(circle,rgba(255,200,0,.28),transparent 62%);animation:fglow 4s ease-in-out infinite}
.s2orb img{position:absolute;inset:0;margin:auto;height:auto;aspect-ratio:203/169;transform:none;width:64px;opacity:.95;filter:drop-shadow(0 10px 28px rgba(255,200,0,.6));animation:orbHeart 4.5s ease-in-out infinite}
@keyframes orbHeart{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.s2stats{display:flex;gap:10px;margin-top:20px;animation:rise .9s var(--ease) 1.2s backwards}
.s2stats span{flex:1;display:flex;flex-direction:column;padding:12px 12px 10px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.08);font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.s2stats b{font-family:var(--hf);font-size:24px;color:#fff;letter-spacing:-.02em;line-height:1.1}
.s2sec{padding:30px 18px 0}
.s2h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.s2n{font-family:var(--hf);font-weight:700;font-size:12px;color:#17181a;background:var(--y);border-radius:7px;padding:3px 7px;letter-spacing:.04em}
.s2h b{font-family:var(--hf);font-size:21px;letter-spacing:-.02em;white-space:nowrap}
.s2h i{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent)}
.s2h.rv{opacity:0;transform:translateX(-14px);transition:opacity .6s,transform .7s var(--ease)}.s2h.rv.in{opacity:1;transform:none}
.s2paths{display:grid;gap:10px}
.s2cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s2cat{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 12px 14px;border-radius:22px;text-align:start;color:var(--text);overflow:hidden;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 16%,rgba(44,46,50,.96)),rgba(34,36,40,.96) 65%);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);transition:transform .5s var(--spring)}

.mring b{font-family:var(--hf);font-size:18px;line-height:1;margin-top:-6px}.mring small{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.rc2-say{margin-top:16px;padding:13px 14px;border-radius:16px;background:linear-gradient(135deg,rgba(255,210,0,.1),rgba(255,210,0,.02));border:1px solid rgba(255,210,0,.18)}

.rc2-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.rc2-facts>div{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);min-width:0}

.rc2-facts span{min-width:0}.rc2-facts small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}

.lvltag{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);font-size:12px;font-weight:600;white-space:nowrap}
/* ===== catalogue rows ===== */
.row2{display:flex;gap:13px;align-items:center;width:100%;text-align:start;padding:10px 12px 10px 10px;margin-top:10px;border-radius:20px;position:relative;overflow:hidden;color:var(--text);background:linear-gradient(100deg,color-mix(in srgb,var(--c) 10%,rgba(44,46,50,.96)),rgba(36,38,42,.96) 45%);border:1px solid rgba(255,255,255,.07);transition:transform .45s var(--spring),border-color .3s}

.r2k{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:color-mix(in srgb,var(--k) 16%,transparent);color:#e8e8e8}

/* filters */
.search{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}

/* ===== area tiles ===== */
.tile{min-height:132px;border-radius:22px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,#2b2e33),#212327 75%)!important;border:1px solid color-mix(in srgb,var(--c) 35%,rgba(255,255,255,.06));box-shadow:0 18px 34px -24px rgba(0,0,0,.9)}

.tile .icn{width:44px;height:44px;right:14px;top:14px}
.tile .ppl{opacity:.95}

.tile.on .nm::after{display:none}
.tile.full{background:linear-gradient(160deg,#2b2e33,#212327)!important;border-style:dashed}
/* ===== option rows (position etc.) ===== */
.opt{min-height:76px;padding:14px 16px;gap:14px}
.opt .ic{width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,rgba(255,210,0,.18),rgba(255,210,0,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.opt .chk{border-radius:50%!important;width:26px;height:26px}

.opts .opt{animation:optIn .6s cubic-bezier(.22,1,.36,1) backwards}

.q h2{letter-spacing:-.035em}
/* ===== hero orb with ring text ===== */
.s2row{display:flex;align-items:center;gap:14px;margin-top:14px}
.s2row p{flex:1;margin:0!important;min-width:0}
.s2orb{position:relative!important;inset:auto!important;flex:none;width:132px!important;height:132px!important;z-index:0!important;animation:rise 1.2s var(--ease) 1.1s backwards}
.s2orb .o2{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,200,0,.3),transparent 62%);animation:fglow 4s ease-in-out infinite}

.s2ring text{font-family:var(--hf);font-weight:700;font-size:13.5px;letter-spacing:.12em;fill:var(--y)}

function tone(f,dur,vol,delay,type){const c=actx();if(!c)return;const t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);lp.type='lowpass';lp.frequency.value=2400;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(lp);lp.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)}

function recommend(){recommend.near=false;let res=SEMINARE.map(s=>score(s)).filter(Boolean);
  if(!res.length){res=SEMINARE.map(s=>score(s,true)).filter(Boolean);if(res.length)recommend.near=true}
  res.sort((a,b)=>b.sc-a.sc);const MAX=recommend.near?3:6;const pick=[],g={},used=new Set();
  const ok=x=>!(x.s.grp&&(g[x.s.grp]||0)>=1);const add=x=>{pick.push(x);used.add(x.s.id);if(x.s.grp)g[x.s.grp]=(g[x.s.grp]||0)+1};
  for(const k of S.ints){const b=res.find(x=>!used.has(x.s.id)&&x.hit.includes(k)&&ok(x));if(b&&pick.length<MAX)add(b)}

function kRecommend(){const W=[1,.75,.55,.4];const r=k=>S.k[k]||3;
  const res=SEMINARE.filter(s=>posOk(s)&&areaOk(s)&&(s.ints||[])[0]!=='pflicht'&&!KTOOLS.includes(s.id)).map(s=>{const kp=s.komp||[];
    const hits=kp.slice(0,2).filter(k=>r(k)<=3);if(!hits.length)return null;
    let sc=0,mx=0;kp.forEach((k,i)=>{sc+=(W[i]||.3)*(5-r(k));mx+=(W[i]||.3)*4});
    const av=hits.reduce((a,k)=>a+r(k),0)/hits.length;let lv=1;
    if(s.fl){if(av<=2&&s.fl>=3)lv=.6;else if(av>=3&&s.fl===1)lv=.8}else if(s.lvl){if(av<=2&&s.lvl===3)lv=.6;else if(av>=3&&s.lvl===1)lv=.8}
    return {s,sc:sc*lv,pct:Math.max(40,Math.min(99,Math.round(100*sc*lv/mx))),hits:hits.sort((a,b)=>r(a)-r(b))}}).filter(Boolean).sort((a,b)=>b.sc-a.sc);
  const low=KOMP.map(x=>x[2]).filter(k=>r(k)<=3).sort((a,b)=>r(a)-r(b));
  const pick=[],used=new Set(),g={};const ok=x=>!(x.s.grp&&(g[x.s.grp]||0)>=1);const add=x=>{pick.push(x);used.add(x.s.id);if(x.s.grp)g[x.s.grp]=(g[x.s.grp]||0)+1};
  for(const k of low.slice(0,4)){const b=res.find(x=>!used.has(x.s.id)&&x.hits.includes(k)&&ok(x));if(b&&pick.length<6)add(b)}

const kwRM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function kwTurn(w,f){if(!w)return;let cur=parseFloat(w.dataset.rot||'0'),target=0;
  if(f){const bis=KFO.indexOf(f)*90-45;target=(matchMedia('(min-width:900px)').matches?180:90)-bis}

function heartLoader(msg,steps,then){const o=document.createElement('div');o.id='hload';
  o.innerHTML=`<div class="hl-glow"></div><div class="hl-hearts">${[0,1,2,3,4].map(i=>`<img src="img/ui/6e072e6aa8.png" alt="" style="--i:${i}">`).join('')}</div><b class="hl-t">${esc(msg)}</b><div class="hl-steps">${steps.map((s,i)=>`<span style="--i:${i}">${svg('check')}${esc(s)}</span>`).join('')}</div>`;
  document.body.appendChild(o);requestAnimationFrame(()=>o.classList.add('on'));play('open');haptic(10);
  steps.forEach((_,i)=>setTimeout(()=>{const e=o.querySelectorAll('.hl-steps span')[i];if(e){e.classList.add('ok');play('tick');haptic(4)}},420+i*480));
  setTimeout(()=>{then();setTimeout(()=>{o.classList.remove('on');o.classList.add('off');setTimeout(()=>o.remove(),600)},120)},420+steps.length*480+260)}
function setLv(v){if(v===S.lvSel)return;S.lvSel=v;fb('tick',6);const r=document.getElementById('lvr');if(r)r.value=v;document.querySelectorAll('.lvticks span').forEach(e=>e.classList.toggle('on',+e.dataset.lvs===v));const b=document.getElementById('lvbox');if(b){b.innerHTML=lvCard();b.querySelectorAll('.row2').forEach((x,i)=>{x.classList.add('stg');x.style.setProperty('--i',Math.min(i,8))});b.querySelector('.lvcard').classList.add('pop')}}
app.addEventListener('input',e=>{if(e.target.id==='lvr'){lvFill(e.target);setLv(+e.target.value)}});
function lvFill(r){r.style.setProperty('--v',((r.value-r.min)/(r.max-r.min)*100).toFixed(1))}
function ringsIn(root){setTimeout(()=>(root||document).querySelectorAll('.mring .fgc[data-off]').forEach((c,i)=>setTimeout(()=>c.style.strokeDashoffset=c.dataset.off,120*i)),350)}
function fitAll(root){(root||document).querySelectorAll('[data-fit]').forEach(el=>{let fs=+el.dataset.fit;el.style.fontSize=fs+'px';let n=0;while(el.scrollWidth>el.clientWidth+1&&fs>10&&n<40){fs-=.5;el.style.fontSize=fs+'px';n++}})}
window.addEventListener('resize',()=>fitAll(app));
let ticking=false;
function onScroll(){const y=window.scrollY;const fbar=app.querySelector('.bar.float');if(fbar)fbar.classList.toggle('solid',y>220);
  const dh=app.querySelector('.dhero');if(dh&&y<460)dh.querySelectorAll('.ph,.ppl,.ingi,.hicn').forEach((el,i)=>el.style.translate=`0 ${y*(i===0?.4:.2+i*.1)}px`);
  const vi=app.querySelector('.visual .img div');if(vi&&y<800)vi.style.translate=`0 ${y*.12}px`}
window.addEventListener('scroll',()=>{if(ticking)return;ticking=true;requestAnimationFrame(()=>{ticking=false;onScroll()})},{passive:true});
window.addEventListener('keydown',e=>{if(!vOpen)return;if(e.key==='ArrowRight')gotoV(vIdx+1,true);if(e.key==='ArrowLeft')gotoV(vIdx-1,true);if(e.key==='Escape')closeViewer()});

applyDir();loadLang(LANG,()=>{if(LANG!=='de'&&!(I18N[LANG]&&I18N[LANG].ui))LANG='de';applyDir();buildBgRows();runIntro(()=>render())});
</script>

/* PWA: Service Worker für Home-Bildschirm & Offline */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
